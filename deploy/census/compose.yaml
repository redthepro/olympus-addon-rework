name: olympus-census
services:
  census:
    image: olympus-census:policy-review
    restart: unless-stopped
    env_file: /etc/olympus-census/runtime.env
    environment:
      CENSUS_DB: /data/census.sqlite3
      CENSUS_PORT: '8788'
      CENSUS_INTERVAL: '900'
      PYTHONDONTWRITEBYTECODE: '1'
    ports:
      - '${CENSUS_BIND_IP:-127.0.0.1}:8788:8788'
    volumes:
      - /var/lib/olympus-census:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: '2'
